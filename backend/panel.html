<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Panel de uso · Asistente CECAPI</title>
<style>
  :root {
    --fondo: #f6f5f1; --tarjeta: #ffffff; --texto: #1d1d1b; --suave: #5b5a55;
    --borde: #dcdad2; --acento: #0b5cad; --aviso: #9a4b00; --aviso-fondo: #fff1e0;
    --error: #a1261b; --barra: #0b5cad; --barra-fondo: #e6eef7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #141413; --tarjeta: #1f1f1d; --texto: #f0efe9; --suave: #b3b1a8;
      --borde: #3a3935; --acento: #79b4f2; --aviso: #ffb366; --aviso-fondo: #3a2814;
      --error: #ff8a7a; --barra: #79b4f2; --barra-fondo: #26313d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  p.sub { color: var(--suave); margin: 0 0 24px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 24px; }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
  input, select, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--borde); }
  input, select { background: var(--tarjeta); color: var(--texto); min-width: 0; }
  button { background: var(--acento); color: var(--fondo); border-color: var(--acento); font-weight: 600; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  .rejilla { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-bottom: 16px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; }
  .cifra { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pie { color: var(--suave); font-size: .9rem; }
  .medidor { height: 12px; background: var(--barra-fondo); border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
  .medidor > span { display: block; height: 100%; background: var(--barra); }
  .tarjeta.alerta { border-color: var(--aviso); background: var(--aviso-fondo); }
  .tarjeta.alerta .medidor > span { background: var(--aviso); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--borde); }
  td.n, th.n { text-align: right; }
  .tabla-ancha td:first-child { white-space: nowrap; }
  td.n { white-space: nowrap; padding-left: 12px; }
  #estado { min-height: 1.5em; margin: 0 0 16px; }
  #estado.error { color: var(--error); font-weight: 600; }
  .tabla-ancha { overflow-x: auto; }
  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <h1>Panel de uso del asistente</h1>
  <p class="sub">Cuántas peticiones recibe el servidor del Módulo 3, qué IA las contesta y cuánto tardan. Solo números: aquí no se muestran textos, fotos ni direcciones IP.</p>

  <form id="forma">
    <label>Periodo
      <select id="dias">
        <option value="1">Hoy</option>
        <option value="7" selected>Últimos 7 días</option>
        <option value="30">Últimos 30 días</option>
        <option value="90">Últimos 90 días</option>
      </select>
    </label>
    <button type="submit">Actualizar</button>
  </form>

  <p id="estado" role="status" aria-live="polite"></p>

  <section aria-labelledby="t-hoy">
    <h2 id="t-hoy">Hoy, contra el límite diario</h2>
    <div class="rejilla" id="hoy"></div>
  </section>

  <section aria-labelledby="t-periodo">
    <h2 id="t-periodo">Periodo</h2>
    <div class="rejilla" id="resumen"></div>
    <div class="rejilla" id="desglose"></div>
  </section>

  <section class="tarjeta" aria-labelledby="t-actividad">
    <h2 id="t-actividad">Actividad por día</h2>
    <div class="tabla-ancha" id="actividad"></div>
  </section>

  <section class="tarjeta" aria-labelledby="t-dias" style="margin-top:16px">
    <h2 id="t-dias">Peticiones a cada IA por día</h2>
    <div class="tabla-ancha" id="por-dia"></div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const NOMBRES = {
    groq: "Groq (texto)", groq_vision: "Groq (fotos)", gemini: "Gemini",
    preguntar: "/preguntar", entender: "/entender", ver: "/ver (fotos)", documento: "/documento",
    preguntas: "Preguntas", comandos: "Abrieron un módulo", bloqueados: "Bloqueadas por datos personales",
    errores: "Ninguna IA respondió",
  };
  const nombre = (k) => NOMBRES[k] || k;
  const num = (n) => (n ?? 0).toLocaleString("es-MX");
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // La clave la pide el navegador (usuario: cualquiera; contraseña: CECAPI_CLAVE_APP) al abrir
  // /panel, y la reusa en esta petición. Nunca va en la liga.
  async function pedir(ruta) {
    const r = await fetch(ruta, { cache: "no-store", credentials: "same-origin" });
    if (r.status === 401) throw new Error("La clave no coincide con CECAPI_CLAVE_APP. Recarga la página para escribirla de nuevo.");
    if (!r.ok) {
      let detalle = `El servidor respondió ${r.status}.`;
      try { detalle = (await r.json()).detail || detalle; } catch (_) {}
      throw new Error(detalle);
    }
    return r.json();
  }

  function tarjetaHoy(prov, d) {
    const pct = d.porcentaje;
    const ancho = pct == null ? 0 : Math.min(pct, 100);
    const limite = d.limite == null ? "sin límite configurado" : `de ${num(d.limite)} al día`;
    return `<div class="tarjeta${d.aviso ? " alerta" : ""}">
      <div>${esc(nombre(prov))}</div>
      <div class="cifra">${num(d.usadas)}</div>
      <div class="medidor" role="img" aria-label="${pct == null ? "Sin límite" : pct + " por ciento del límite"}"><span style="width:${ancho}%"></span></div>
      <div class="pie">${limite}${pct == null ? "" : ` · ${pct}%`}${d.aviso ? " · pasó el 80%" : ""}</div>
    </div>`;
  }

  function tarjetaCifra(titulo, valor, pie) {
    return `<div class="tarjeta"><div>${esc(titulo)}</div><div class="cifra">${valor}</div><div class="pie">${esc(pie)}</div></div>`;
  }

  function tarjetaLista(titulo, filas) {
    const html = filas.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${esc(v)}</td></tr>`).join("");
    return `<div class="tarjeta"><h2>${esc(titulo)}</h2>${html ? `<table><tbody>${html}</tbody></table>` : '<p class="pie">Sin datos en este periodo.</p>'}</div>`;
  }

  function tabla(caption, columnas, filas, vacia) {
    if (!filas.length) return `<p class="pie">${esc(vacia)}</p>`;
    return `<table><caption class="oculto">${esc(caption)}</caption><thead><tr>${columnas.map((c, i) => `<th class="${i ? "n" : ""}" scope="col">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${filas.map((f) => `<tr>${f.map((v, i) => `<td class="${i ? "n" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }

  function tablaPorDia(filas) {
    const provs = [...new Set(filas.map((f) => f.proveedor))];
    const fechas = [...new Set(filas.map((f) => f.fecha))];
    const celda = (f, p) => num((filas.find((x) => x.fecha === f && x.proveedor === p) || {}).peticiones);
    return tabla("Peticiones por día y proveedor", ["Día", ...provs.map(nombre)],
      fechas.map((f) => [f, ...provs.map((p) => celda(f, p))]), "Sin peticiones a la IA en este periodo.");
  }

  async function cargar(e) {
    if (e) e.preventDefault();
    $("estado").className = "";
    $("estado").textContent = "Cargando…";
    try {
      const d = await pedir(`panel/datos?dias=${$("dias").value}`);
      $("hoy").innerHTML = Object.entries(d.hoy.proveedores).map(([p, x]) => tarjetaHoy(p, x)).join("");
      const respuestas = d.tiempos.reduce((s, t) => s + t.respuestas, 0);
      const promedio = respuestas ? Math.round(d.tiempos.reduce((s, t) => s + t.promedio_ms * t.respuestas, 0) / respuestas) : null;
      const peticiones = Object.values(d.por_ruta).reduce((s, n) => s + n, 0);
      $("resumen").innerHTML =
        tarjetaCifra("Peticiones", num(peticiones), `del ${d.desde} al ${d.hasta}`) +
        tarjetaCifra("Tiempo con IA", promedio == null ? "—" : `${num(promedio)} ms`, "promedio de las respuestas de la IA") +
        tarjetaCifra("Sin respuesta", num(d.totales.errores), "veces que ninguna IA contestó");
      $("desglose").innerHTML =
        tarjetaLista("Por ruta", Object.entries(d.por_ruta).map(([k, v]) => [nombre(k), num(v)])) +
        tarjetaLista("Por resultado", Object.entries(d.totales).map(([k, v]) => [nombre(k), num(v)])) +
        tarjetaLista("Por IA", d.tiempos.map((t) => [nombre(t.proveedor), `${num(t.respuestas)} · ${num(t.promedio_ms)} ms`]));
      $("actividad").innerHTML = tabla("Actividad por día", ["Día", "Preguntas", "Comandos", "Bloqueadas", "Sin respuesta"],
        d.actividad.map((a) => [a.fecha, num(a.preguntas), num(a.comandos), num(a.bloqueados), num(a.errores)]),
        "Todavía no hay mensajes en este periodo.");
      $("por-dia").innerHTML = tablaPorDia(d.peticiones);
      $("estado").textContent = `Actualizado a las ${new Date().toLocaleTimeString("es-MX")} · día del contador: ${d.hoy.fecha}.`;
    } catch (error) {
      $("estado").className = "error";
      $("estado").textContent = error.message;
    }
  }

  $("forma").addEventListener("submit", cargar);
  $("dias").addEventListener("change", cargar);
  cargar();
})();
</script>
</body>
</html>
